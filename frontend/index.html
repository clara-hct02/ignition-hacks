<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="card profile-card">
                <h2>dashboard</h2>
                <p>YOUR WORK</p>
                <div class="heart-icon">❤️</div>
            </div>
            <div class="card feedback-card">
                <h3>Good Work!</h3>
                <p>from: Anon67</p>
            </div>
            <button class="upload-btn" id="upload-btn">UPLOAD NEW</button>
            <input type="file" id="myFile" style="display: none;">
        </aside>

        <main class="main-content">
            <div class="top-nav">
                <button class="nav-tab active">feedback received</button>
                <button class="nav-tab">Give feedback</button>
                <span class="view-previous">view previous</span>
            </div>

            <div class="canvas-container">
                <div class="artwork-frame">
                    <div class="artwork-placeholder" id="artwork-display">Add your art work using the upload button!</div>
                    <button class="match-btn">MATCH!</button>
                </div>
            </div>

            <div class="feedback-input-section">
                <div class="comment-display">
                    <strong>Feedback:</strong>
                </div>

                <div class="tags-section">
                    <textarea placeholder="Feedback here..." class="feedback-input"></textarea>
                    <button class="send-btn">SEND</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
